name: Build Plugin Dev Release

on:
  push:
    branches:
      - "vaccfr"
      - "develop"
      - "clangci"

env:
  DLL_NAME: vACDM.dll
  BUILD_CONFIGURATION: Release
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  VERSION: "0"
  DEV_RELEASE: "1"

jobs:
  formatting-check:
    uses: ./.github/workflows/clang-format.yml

  build:
    needs: formatting-check
    runs-on: windows-latest
    name: "Build plugin"

    steps:
      - uses: actions/checkout@v4

      - name: Checkout submodules
        shell: bash
        run: git submodule update --init --recursive vcpkg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyGithub

      - name: Run version handler
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          python .github/workflows/version_handler.py

      - name: Determine DEV_RELEASE value
        id: find_latest_dev_release
        env:
          REPOSITORY: ${{ github.repository }}
        run: python .github/workflows/determine_dev_release.py

      - name: Install clang-tools for Visual Studio
        shell: powershell
        run: |
          # Find VS installation path using vswhere
          $installPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
            
          if (-not $installPath) {
          Write-Error "Visual Studio installation not found"
          exit 1
          }
            
          Write-Host "Found Visual Studio at: $installPath"
            
          # Use VS Installer to add components
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe" modify `
          --installPath "$installPath" `
          --add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
          --add Microsoft.VisualStudio.Component.VC.ClangTools `
          --quiet --norestart --wait
            
          if ($LASTEXITCODE -ne 0) {
          Write-Error "Visual Studio component installation failed with exit code $LASTEXITCODE"
          exit $LASTEXITCODE
          }
            
          Write-Host "Successfully installed clang-tools"

      - name: Set up clang env
        shell: powershell
        run: |
          # Set environment variables to force clang usage
          echo "CC=clang-cl" >> $env:GITHUB_ENV
          echo "CXX=clang-cl" >> $env:GITHUB_ENV
          
          # Verify clang is accessible
          clang-cl --version
          
          # Add clang to PATH if needed
          $clangPath = "$installPath\VC\Tools\Llvm\x64\bin"
          if (Test-Path $clangPath) {
            echo "$clangPath" >> $env:GITHUB_PATH
          }

      - name: Configure CMake with clang
        run: |
          cmake -B build `
          -T ClangCL,host=x86 `
          -A Win32 `
          -DCMAKE_C_COMPILER=clang-cl `
          -DCMAKE_CXX_COMPILER=clang-cl `
          -DCMAKE_LINKER=lld-link `
          -DDEV_BUILD=ON `
          -DCMAKE_BUILD_TYPE=${{env.BUILD_CONFIGURATION}} `
          -DDEV_RELEASE_NUMBER="${{ env.DEV_RELEASE }}"

      - name: Build DLL
        run: cmake --build build --config ${{env.BUILD_CONFIGURATION}}

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: v${{ env.VERSION }}
          release_name: v${{ env.VERSION }}
          draft: true # to allow amendment of release notes
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: build/${{env.BUILD_CONFIGURATION}}/${{env.DLL_NAME}}
          asset_name: ${{env.DLL_NAME}}
          asset_content_type: application/octet-stream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload config file (vacdm.txt)
        id: upload-release-asset-txt
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: src/config/vacdm.txt
          asset_name: vacdm.txt
          asset_content_type: text/plain
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
