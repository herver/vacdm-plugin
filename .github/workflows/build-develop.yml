name: Build Plugin Dev Release

on:
  push:
    branches:
      - "vaccfr"
      - "develop"
      - "clangci"

env:
  DLL_NAME: vACDM.dll
  BUILD_CONFIGURATION: Release
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  VERSION: "0"
  DEV_RELEASE: "1"

jobs:
  formatting-check:
    uses: ./.github/workflows/clang-format.yml

  build:
    needs: formatting-check
    runs-on: windows-latest
    name: "Build plugin"

    steps:
      - uses: actions/checkout@v4

      - name: Checkout submodules
        shell: bash
        run: git submodule update --init --recursive vcpkg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyGithub

      - name: Run version handler
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          python .github/workflows/version_handler.py

      - name: Determine DEV_RELEASE value
        id: find_latest_dev_release
        env:
          REPOSITORY: ${{ github.repository }}
        run: python .github/workflows/determine_dev_release.py

      - name: Install MSVC toolset
        run: choco upgrade visualstudio2022buildtools

      - name: Install clang-tools
        run: |
          "c:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe" modify --installPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" --add Microsoft.VisualStudio.Component.VC.ClangTools --quiet --norestart

      - name: Set up MSVC environent
        shell: pwsh
        run: |
          Import-Module "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools"

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{env.BUILD_CONFIGURATION}} -A Win32 -DDEV_BUILD=ON -DDEV_RELEASE_NUMBER="${{ env.DEV_RELEASE }}"

      - name: Build DLL
        run: cmake --build build --config ${{env.BUILD_CONFIGURATION}}

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: v${{ env.VERSION }}
          release_name: v${{ env.VERSION }}
          draft: true # to allow amendment of release notes
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: build/${{env.BUILD_CONFIGURATION}}/${{env.DLL_NAME}}
          asset_name: ${{env.DLL_NAME}}
          asset_content_type: application/octet-stream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload config file (vacdm.txt)
        id: upload-release-asset-txt
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: src/config/vacdm.txt
          asset_name: vacdm.txt
          asset_content_type: text/plain
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
